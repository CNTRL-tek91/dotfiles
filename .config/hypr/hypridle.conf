general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = hyprlock
  # Re-push the saved OpenRGB effect on resume - some USB rails power-cycle
  # across suspend even when the rest of the laptop resumes fine, and this
  # controller has no onboard memory of its own to fall back on. There's no
  # matching before_sleep save step: this hardware can't be read back from
  # (see openrgb_restore_state.sh/openrgb_autostart.sh) - a separate CLI
  # invocation re-detects the device from scratch and gets blank colors, not
  # whatever's actually showing - so the profile it reloads is one saved
  # deliberately from OpenRGB's own GUI, not captured automatically here.
  after_sleep_cmd = ~/.config/hypr/scripts/openrgb_restore_state.sh
}

listener {
  timeout = 600
  on-timeout = hyprlock
}

listener {
  timeout = 1200
  on-timeout = systemctl suspend
}
