# Every path that starts hyprlock must guard against one already running.
# hypridle has no variables, so the `pidof hyprlock ||` prefix is repeated
# rather than shared - miss it on one path and that path leaks a lock screen
# per fire. That is exactly what happened here: only lock_cmd was guarded,
# so the 600s listener and before_sleep_cmd each spawned an unconditional
# hyprlock and left 7 of them alive over 4 days, ~250 MB each. They never
# exit because only the topmost lock surface receives input, so the ones
# underneath can never be unlocked.
#
# Routing these through `loginctl lock-session` instead would centralise the
# guard in lock_cmd, but it makes locking depend on the logind Lock signal
# reaching hypridle. This is the screen lock, so it keeps the dumb explicit
# form that cannot silently fail open.
general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = pidof hyprlock || hyprlock
  # Re-push the saved OpenRGB effect on resume - some USB rails power-cycle
  # across suspend even when the rest of the laptop resumes fine, and this
  # controller has no onboard memory of its own to fall back on. There's no
  # matching before_sleep save step: this hardware can't be read back from
  # (see openrgb_restore_state.sh/openrgb_autostart.sh) - a separate CLI
  # invocation re-detects the device from scratch and gets blank colors, not
  # whatever's actually showing - so the profile it reloads is one saved
  # deliberately from OpenRGB's own GUI, not captured automatically here.
  # Full restart, not a profile reload into the running instance. After
  # suspend the USB controller may have been re-enumerated underneath a
  # still-running OpenRGB; reloading a profile into that leaves the previous
  # effect's state behind and a second effect composites over the first. That
  # is the pink overlay plus glitching seen after every sleep/resume. Killing
  # first is the only guaranteed clean slate - this controller has no readable
  # state to reconcile against.
  after_sleep_cmd = ~/.config/hypr/scripts/openrgb_restart.sh resume
}

listener {
  timeout = 600
  on-timeout = pidof hyprlock || hyprlock
}

listener {
  timeout = 1200
  on-timeout = systemctl suspend
}
