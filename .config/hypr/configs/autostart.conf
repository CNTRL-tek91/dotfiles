exec-once = awww-daemon
exec-once = hypridle
exec-once = hyprctl setcursor Adwaita 24
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar

# Notification daemon (waybar + keybinds call swaync-client; the daemon itself
# must be running for notifications to appear).
exec-once = swaync

# Clipboard history: watch the Wayland clipboard and store text + images.
# Pick past entries with Super+V (see binds.conf).
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Fan / power-profile on-screen indicator (pops a notification on Fn+F6 changes).
exec-once = ~/.config/hypr/scripts/profile_osd.sh

# SwayOSD server: draws the on-screen volume/brightness slider overlay. The
# volume keys call swayosd-client, which needs this daemon running.
# --style themes it with the pywal colors (see ~/.config/swayosd/style.css).
exec-once = swayosd-server --style ~/.config/swayosd/style.css

exec = ~/.config/hypr/scripts/set_wallpaper.sh

# GTK settings
exec = gsettings set $GNOME_SCHEMA gtk-theme 'adw-gtk3-dark'
exec = gsettings set $GNOME_SCHEMA color-scheme 'prefer-dark'
exec = gsettings set $GNOME_SCHEMA icon-theme 'Adwaita'
exec = gsettings set $GNOME_SCHEMA cursor-theme 'Adwaita'
exec = gsettings set $GNOME_SCHEMA font-name 'JetBrainsMono Nerd Font Propo'

exec-once = systemctl --user start xdg-desktop-portal-hyprland
