input {
  kb_layout = us,ru
  kb_variant =
  kb_model =
  kb_options = grp:alt_shift_toggle, caps:escape
  kb_rules =

  follow_mouse = 1

  touchpad {
      natural_scroll = yes
  }

  sensitivity = -0.6
}

# ---------------------------------------------------------------------------
# Per-device overrides (these are TOP-LEVEL blocks, not inside `input {}`).
# The global `sensitivity = -0.6` above intentionally slows the wireless mouse.
# The blocks below reset the built-in Elan trackpad back to normal (0) so it
# isn't dragged down by that global setting.
# Device names come from `hyprctl devices`.
# ---------------------------------------------------------------------------
device {
    name = syna7db5:00-06cb:cd5f-touchpad
    sensitivity = 0.07
}

device {
    name = syna7db5:00-06cb:cd5f-mouse
    sensitivity = 0
}
