misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0

  # Hyprland pings every toplevel once a second and pops an
  # "<app> is not responding / Terminate / Wait" dialog once a window has
  # missed anr_missed_pings of them in a row. The default 5 is far too tight
  # for this machine and fires on healthy windows.
  #
  # Two things here make a window miss pings without being hung:
  #   - hypridle locks the session after 600s and suspends it after 1200s, so
  #     every idle stretch occludes every window behind hyprlock.
  #   - the NVIDIA GPU has to restore its context on unlock/resume, and a
  #     GL client can sit in its buffer swap until the compositor hands out
  #     frame callbacks again. kitty is the one that shows it because it is
  #     the window that stays open across those cycles.
  #
  # Confirmed false-positive rather than a real hang: after a 9h suspend both
  # kitty instances answered `kitty @ ls` in ~50ms and were in a normal
  # poll_schedule_timeout wait, not blocked.
  #
  # 30 gives a window half a minute to come back before it is called hung,
  # which still catches a genuinely wedged app. There is no per-window opt-out
  # to use instead - `noanr` is not a valid window rule in 0.56.2.
  anr_missed_pings = 30
}
