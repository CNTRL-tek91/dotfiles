# Converted to Hyprland 0.55 windowrule syntax (hyprlang).
# Format: windowrule = <property> <value>, match:<key> <value>
# (the old windowrulev2 / class:(...) field syntax was removed in 0.55)

# Assign applications to workspaces
windowrule = workspace 2, match:class LibreWolf
windowrule = workspace 3, match:class code-url-handler
windowrule = workspace 3, match:class jetbrains-pycharm
windowrule = workspace 4, match:class burp-StartBurp
windowrule = workspace 4, match:class Genymotion
windowrule = workspace 4, match:class Insomnia
windowrule = workspace 5, match:class com.ayugram.desktop
windowrule = workspace 5, match:class org.telegram.desktop
windowrule = workspace 6, match:title Spotify Free
windowrule = workspace 7, match:class obsidian
windowrule = workspace 8, match:class zoom
windowrule = workspace 9, match:class virt-manager
windowrule = workspace 10, match:class vesktop

# Windows opacity
windowrule = opacity 0.8, match:class code-url-handler
windowrule = opacity 0.8, match:class jetbrains-pycharm
windowrule = opacity 0.8, match:initial_title Spotify Free
windowrule = opacity 0.8, match:class org.telegram.desktop
windowrule = opacity 0.8, match:class com.ayugram.desktop
windowrule = opacity 0.8, match:class org.gnome.Nautilus
windowrule = opacity 0.8, match:class SWT
windowrule = opacity 0.8, match:class Simplenote
windowrule = opacity 0.8, match:class Postman
windowrule = opacity 0.8, match:class Insomnia
windowrule = opacity 0.8, match:class jadx-gui
windowrule = opacity 0.8, match:class localsend_app
windowrule = opacity 0.8, match:class obsidian

# Windows tiling
windowrule = tile true, match:class burp-StartBurp, match:title Burp Suite Professional
windowrule = tile true, match:class Alacritty
windowrule = tile true, match:class Moonlight

# Windows floating
windowrule = float true, match:class SWT
windowrule = float true, match:class Genymotion Player
windowrule = float true, match:class scrcpy
# windowrule = float true, match:class Chromium-browser
# windowrule = float true, match:class Chromium
windowrule = float true, match:class wlogout
windowrule = float true, match:title Media viewer
windowrule = float true, match:title File Operation Progress
windowrule = float true, match:title win
windowrule = float true, match:title Java
windowrule = center true, match:float true, match:title Java
windowrule = center true, match:float true, match:title splash
windowrule = no_focus true, match:class ^jetbrains-(?!toolbox), match:float true, match:title ^win\d+$ # Prevents jetbrains menu from disrupting window focus

# Prevent suspend when a fullscreen app is open
windowrule = idle_inhibit fullscreen, match:class .*
windowrule = idle_inhibit fullscreen, match:title .*
windowrule = idle_inhibit fullscreen, match:fullscreen true
