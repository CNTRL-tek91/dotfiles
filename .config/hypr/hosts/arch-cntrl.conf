# Per-machine config for arch-cntrl (Laptop 2).
# Sourced LAST from hyprland.conf, so it can override anything above it and
# $mainMod is already defined by binds.conf.

# Panel is wired to the NVIDIA GPU (card1-eDP-1). Fallback until `hyprctl
# monitors` confirms the real mode - see note at the bottom.
monitor = , preferred, auto, 1

xwayland {
  force_zero_scaling = true
}

# NOTE: no LIBVA_DRIVER_NAME override here. This machine is MUX'd to discrete
# only - the i7-8750H's UHD 630 is disabled in firmware and no Intel GPU appears
# in lspci - so the LIBVA_DRIVER_NAME=nvidia from configs/env_vars.conf is
# correct. Do NOT set iHD: there is no Intel GPU to bind to.

# Laptop 1 binds this to `asusctl profile next`, which is ROG-only hardware.
# Laptop 2 switched from power-profiles-daemon to auto-cpufreq (see
# system/README.md) - power-profiles-daemon is masked, so this now cycles
# auto-cpufreq's forced governor instead via scripts/cpufreq_cycle.sh, which
# also handles its own single notification (no double-up like the old
# profile_osd.sh pairing, since auto-cpufreq has no equivalent watcher).
bind = $mainMod, F6, exec, ~/.config/hypr/scripts/cpufreq_cycle.sh

# This machine's M1/M2 keys (left edge of the keyboard) don't send anything a
# Linux driver can see - confirmed no evdev/udev/ACPI/WMI event and nothing in
# `dmesg` on keypress. Lenovo's own manual says these route through a
# Windows-only "Magic Y Key" app instead of the standard hotkey/BIOS layer,
# and the community driver that reverse-engineers this class of Legion WMI
# hotkey (LenovoLegionLinux) has an open, unresolved issue for this exact
# model (Y740/80UF009HV) - its probe fails on this generation's hardware.
# So this does the same 3-way cycle as Super+F6 above, on a key that works.
# Ctrl+Super+P (not plain Super+P) - that's already bound to `pseudo` in the
# shared binds.conf (dwindle pseudotile toggle).
bind = $mainMod CTRL, P, exec, ~/.config/hypr/scripts/cpufreq_cycle.sh
