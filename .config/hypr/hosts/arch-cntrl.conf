# Per-machine config for arch-cntrl (Laptop 2).
# Sourced LAST from hyprland.conf, so it can override anything above it and
# $mainMod is already defined by binds.conf.

# Panel is wired to the NVIDIA GPU (card1-eDP-1). Fallback until `hyprctl
# monitors` confirms the real mode - see note at the bottom.
monitor = , preferred, auto, 1

xwayland {
  force_zero_scaling = true
}

# NOTE: no LIBVA_DRIVER_NAME override here. This machine is MUX'd to discrete
# only - the i7-8750H's UHD 630 is disabled in firmware and no Intel GPU appears
# in lspci - so the LIBVA_DRIVER_NAME=nvidia from configs/env_vars.conf is
# correct. Do NOT set iHD: there is no Intel GPU to bind to.

# Laptop 1 binds this to `asusctl profile next`, which is ROG-only hardware.
# Laptop 2 switched from power-profiles-daemon to auto-cpufreq (see
# system/README.md) - power-profiles-daemon is masked, so this now cycles
# auto-cpufreq's forced governor instead via scripts/cpufreq_cycle.sh, which
# also handles its own single notification (no double-up like the old
# profile_osd.sh pairing, since auto-cpufreq has no equivalent watcher).
bind = $mainMod, F6, exec, ~/.config/hypr/scripts/cpufreq_cycle.sh

# This machine's M1/M2 keys (left edge of the keyboard) don't send anything a
# Linux driver can see - confirmed no evdev/udev/ACPI/WMI event and nothing in
# `dmesg` on keypress. Lenovo's own manual says these route through a
# Windows-only "Magic Y Key" app instead of the standard hotkey/BIOS layer,
# and the community driver that reverse-engineers this class of Legion WMI
# hotkey (LenovoLegionLinux) has an open, unresolved issue for this exact
# model (Y740/80UF009HV) - its probe fails on this generation's hardware.
# So this does the same 3-way cycle as Super+F6 above, on a key that works.
# Ctrl+Super+P (not plain Super+P) - that's already bound to `pseudo` in the
# shared binds.conf (dwindle pseudotile toggle).
bind = $mainMod CTRL, P, exec, ~/.config/hypr/scripts/cpufreq_cycle.sh

# Live wallpaper picker (linux-wallpaperengine), Laptop 2 only for now - it
# reads Wallpaper Engine's Steam Workshop content, which only exists on a
# machine that has that Steam app installed. Pairs with the existing
# Super+Shift+W static-wallpaper picker; V for "video"/live wallpaper.
# The Wallpaper Engine Steam app itself can't paint a Wayland desktop even
# under Proton - it only knows how to hook into Windows' own compositor -
# so this is the actual mechanism, not the Steam app's own UI.
bind = $mainMod SHIFT, V, exec, ~/.config/hypr/scripts/wallpaperengine-rofi.sh

# Stops the live wallpaper and reveals the normal static one again - awww's
# own wallpaper layer never stops running underneath it, so this is just a
# kill. Ctrl+Super+V, same pairing pattern as Ctrl+Super+P vs Super+F6 above.
bind = $mainMod CTRL, V, exec, ~/.config/hypr/scripts/wallpaperengine_stop.sh

# Restore a live wallpaper across reboot/relogin if one was active before -
# set_wallpaper.sh above (autostart.conf) always shows the static wallpaper
# first, so this runs after it and layers the live one back on top when
# wallpaperengine_state (written by wallpaperengine_launch.sh, cleared by
# wallpaperengine_stop.sh) says one was actually running last.
exec-once = ~/.config/hypr/scripts/wallpaperengine_autostart.sh

# Keep OpenRGB running from login onward. This keyboard's controller has no
# onboard memory (OpenRGB's own UI shows "Saving Not Supported" for it) - any
# custom color or Effects Plugin animation only exists while OpenRGB is
# actively streaming it live. The moment the process exits, the keyboard
# falls back to its own firmware default (a built-in rainbow cycle). Starting
# it minimized to tray at login, combined with minimize_on_close now being
# true in ~/.config/OpenRGB/OpenRGB.json (was false - closing the window used
# to fully quit the app, not minimize it), means the active effect survives
# closing the window.
#
# A real reboot/shutdown still kills the process outright, which loses power
# to the controller too - that's what openrgb_autostart.sh is for: it starts
# OpenRGB AND reloads the "last-state" profile, so the effect picks back up
# instead of sitting on firmware-default rainbow after boot. That profile is
# saved manually from inside OpenRGB (File > Save Profile As > "last-state")
# whenever you want a new default remembered, not captured automatically -
# this hardware can't be read back from, so an external script has no way to
# discover what's currently showing on it. hypridle.conf's after_sleep_cmd
# reloads the same profile after waking from suspend, for the same reason.
exec-once = ~/.config/hypr/scripts/openrgb_autostart.sh
