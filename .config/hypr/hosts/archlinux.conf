# Monitor layout: laptop on the LEFT, external (HDMI) on the RIGHT.
# Syntax: monitor = name, resolution@refresh, position(x)x(y), scale
#
# Laptop panel: 2560x1440 @165Hz, placed at the origin (top-left).
monitor = eDP-1, 2560x1440@165, 0x0, 1
# External Samsung over HDMI: 1920x1080 @144Hz, placed to the right of the
# laptop (x = 2560, the laptop's width). Tops are aligned (y = 0).
monitor = HDMI-A-1, 1920x1080@144, 2560x0, 1

# Fallback for any other monitor that gets plugged in: use its preferred mode
# and auto-place it so you're never left with a blank screen.
monitor = , preferred, auto, 1

xwayland {
  force_zero_scaling = true
}

# --- Hardware-specific bindings for this machine (ASUS ROG) ---
# Cycle fan/power profile (Silent -> Balanced -> Performance); OSD shows the new mode.
# On non-ROG hardware use: powerprofilesctl
bind = $mainMod, F6, exec, asusctl profile next
