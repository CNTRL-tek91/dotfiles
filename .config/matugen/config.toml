# matugen — Material You theming for the UI half of the rice.
# Writes to the SAME files the apps already read (so no app rewiring needed).

[config]

[templates.waybar]
input_path = '/home/cntrl/.config/matugen/templates/waybar-colors.css'
output_path = '/home/cntrl/.config/waybar/wallust/colors.css'

[templates.hypr]
input_path = '/home/cntrl/.config/matugen/templates/hyprland-colors.conf'
output_path = '/home/cntrl/.config/hypr/wallust/colors.conf'

[templates.tofi]
input_path = '/home/cntrl/.config/matugen/templates/tofi-configA'
output_path = '/home/cntrl/.config/tofi/configA'

[templates.dunst]
input_path = '/home/cntrl/.config/matugen/templates/dunstrc'
output_path = '/home/cntrl/.config/dunst/dunstrc'
