# Colors
# Wallpaper-themed palette, post-processed for readability by
# ~/.config/hypr/scripts/kitty_readable_colors.py (run from apply_wal_theme.sh).
# It keeps pywal's hues but enforces a minimum brightness so text stays legible.
include $HOME/.cache/wal/colors-kitty-readable.conf
url_color #4dc6ff

# Font
font_family      JetBrainsMono NF Medium
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0

modify_font underline_position 0
modify_font underline_thickness 100%

modify_font cell_width 100%
modify_font cell_height 2px

# Env
term xterm-256color

# Window
window_padding_width 10
background_opacity 0.8
remember_window_size yes
initial_window_width  640
initial_window_height 400
hide_window_decorations yes
confirm_os_window_close 0

# Cursor
cursor_shape block
cursor_blink_interval -1
cursor_stop_blinking_after 30.0

# Smooth animated cursor trail (the gliding cursor from JaKoolit's setup).
# cursor_trail: microseconds of "lag" before the trail catches up (higher = longer tail).
# cursor_trail_decay: fade in/out speed of the trail (fast slow).
# cursor_trail_start_threshold: min cells moved before a trail is drawn (skips 1-char typing).
cursor_trail 4
cursor_trail_decay 0.2 0.9
cursor_trail_start_threshold 0

# Scrolling
scrollback_lines 2000
scrollback_indicator_opacity 0.5

# Copy on selection
copy_on_select clipboard
strip_trailing_spaces smart

# Undercurl
undercurl_style thin-dense
url_style curly
show_hyperlink_targets yes

# Mouse
mouse_hide_wait 3.0

# Bell
enable_audio_bell no
visual_bell_duration 0.0
visual_bell_color none
window_alert_on_bell no

# Remote control for nvim autocommands
allow_remote_control socket-only
listen_on unix:/tmp/mykitty
