# networkmanager_dmenu ships defaults that do not exist on this machine: it
# falls back to `dmenu` as its launcher and `xterm` as its terminal, and
# neither is installed. Without this file, clicking the waybar network icon
# would fail exactly as silently as the unguarded command it replaced.
#
# rofi is what the rest of this bar uses (wallpaper and CPU pickers), so the
# network list matches them. power-picker.rasi is reused rather than copied;
# it is only 260px wide, which is fine for "Performance / Balanced" but too
# narrow for an SSID plus security type plus signal bars, so the width is
# widened inline. Sizes are in px deliberately - a % here would need escaping
# as %% to survive ConfigParser interpolation.

[dmenu]
dmenu_command = rofi -dmenu -i -theme ~/.config/rofi/power-picker.rasi -theme-str '#window {width: 460px;} #listview {lines: 8;}'
highlight = True
compact = False
# Nerd Font signal icons, matching the bar's own network glyphs.
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name}  {sec}
list_saved = False
prompt = Network

[dmenu_passphrase]
# Mask the passphrase as it is typed (rofi -password).
obscure = True

[editor]
# xterm is not installed; kitty is this machine's terminal.
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
