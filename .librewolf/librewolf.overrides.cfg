// New tab

pref("general.config.obscure_value", 0);
pref("general.config.sandbox_enabled", false);

// Redirect about:newtab to the local startpage. Wrapped so that if the privileged
// JS is unavailable (sandbox), the prefs below still apply.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "file:///home/cntrl/.librewolf/startpage/fazzi/index.html";
} catch (e) {}

// Startup homepage: point straight at the startpage file. about:newtab does NOT honor
// the new-tab redirect when used as the homepage (only real new tabs do), so this is
// the reliable way to show the startpage on launch. The URL bar shows the file path on
// this first tab only; new tabs stay empty. The page's own search bar handles searches.
pref("browser.startup.homepage", "file:///home/cntrl/.librewolf/startpage/fazzi/index.html");
// Keep new tabs un-preloaded so the redirect always applies to them.
pref("browser.newtab.preload", false);

// Prefs
// General

pref("xpinstall.signatures.required", false);
pref("privacy.resistFingerprinting", false);
pref("browser.translations.enable", false);
pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// Stay signed in across restarts.
//
// LibreWolf ships privacy.sanitize.sanitizeOnShutdown = true, and the shutdown
// clear list defaults to including "cookiesAndStorage" - which wipes every
// session cookie on exit, so Google/SoundCloud/GitHub all ask for a login again
// on the next launch.
//
// The two prefs that used to control this are DEAD. Firefox 128 renamed them and
// LibreWolf sets privacy.sanitize.clearOnShutdown.hasMigratedToNewPrefs3 = true,
// after which the old privacy.clearOnShutdown.* names are ignored entirely:
//     privacy.clearOnShutdown.cookies  -> privacy.clearOnShutdown_v2.cookiesAndStorage
//     privacy.clearOnShutdown.history  -> privacy.clearOnShutdown_v2.browsingHistoryAndDownloads
// Setting the old names looks like it works and does nothing. Confirmed against
// the live profile: privacy.sanitize.pending still listed "cookiesAndStorage"
// for shutdown despite privacy.clearOnShutdown.cookies being false.
pref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);

// Keep Google sign-in across restarts.
//
// LibreWolf turns on network.cookie.cookieBehavior.optInPartitioning, which is
// NOT a Firefox default. Under it a third-party cookie is only stored if it
// opts in with the Partitioned attribute. Google's sign-in spans google.com,
// accounts.google.com and youtube.com and does not opt in, so the auth cookies
// never persist.
//
// The symptom is specific and matches: after a full quit and relaunch the
// profile kept exactly the FIRST-party google.com cookies (AEC, NID, SNID,
// SEARCH_SAMESITE, _GRECAPTCHA - search and anti-abuse) and none of the auth
// ones (SID, HSID, SSID, APISID, __Secure-1PSID). A shutdown wipe would have
// taken all of them; this took only the cross-site ones.
//
// TRADE-OFF: this is a real reduction in tracking protection - unpartitioned
// third-party cookies are exactly what LibreWolf hardens against, and it is
// why the setting exists. Total Cookie Protection (cookieBehavior 5) is still
// on, so third-party cookies remain confined per-site; this only stops
// requiring the explicit opt-in. Delete this line to go back.
pref("network.cookie.cookieBehavior.optInPartitioning", false);
// NOTE: history clearing is NOT re-enabled here. The old
// privacy.clearOnShutdown.history = true never actually took effect after the
// migration, and LibreWolf's own default for the v2 name is false, so history
// has not been cleared on shutdown for some time. Set
// privacy.clearOnShutdown_v2.browsingHistoryAndDownloads = true to genuinely
// turn it on - a real behaviour change, not a restoration of the status quo.
pref("dom.security.https_only_mode", false);
pref("browser.sessionstore.resume_from_crash", false);
pref("middlemouse.paste", false);
pref("general.autoScroll", false);
pref("media.videocontrols.picture-in-picture.video-toggle.enabled", false);
pref("browser.search.suggest.enabled", true);
pref("browser.search.suggest.enabled", true);
pref("browser.urlbar.suggest.searches", true);

// Restore Google
// Also edit your policies.json
defaultPref("browser.search.defaultenginename", "Google");

